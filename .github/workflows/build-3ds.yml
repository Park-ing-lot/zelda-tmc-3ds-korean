name: Build 3DS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_probe:
        description: 'Development-only runtime capture and scripted input'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: 3ds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Nintendo 3DS packages
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Verify bundled build tools
        run: |
          for tool in cmake make pkg-config zip; do
            command -v "$tool"
          done

      - name: Prepare pinned CIA packaging tools
        run: |
          mkdir -p .tmp/cia-tools
          cd .tmp/cia-tools
          git clone --depth 1 --branch makerom-v0.19.0 https://github.com/3DSGuy/Project_CTR.git project-ctr
          test "$(git -C project-ctr rev-parse HEAD)" = e8f5f529c54ff9b22a2491a480ffa69206bf7b19
          curl -fL --retry 3 -o bannertool.tar.gz https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3.tar.gz
          echo '3ae61ff21c7762e75ba37a57f248cc0d6a9d4bff92207c57f7420a86dfbd08e6  bannertool.tar.gz' | sha256sum -c -
          make -C project-ctr/makerom deps --jobs=2 CC=/usr/bin/cc CXX=/usr/bin/c++
          make -C project-ctr/makerom program --jobs=2 CC=/usr/bin/cc CXX=/usr/bin/c++
          cp project-ctr/makerom/bin/makerom ./makerom
          tar -xzf bannertool.tar.gz
          cmake -S bannertool-1.2.3 -B bannertool-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=/usr/bin/c++
          cmake --build bannertool-build --parallel 2
          cp bannertool-build/bannertool ./bannertool
          chmod +x makerom bannertool

      - name: Check Korean ROM profile and glyph bounds without game data
        run: |
          /usr/bin/cc -std=c11 -Wall -Wextra -Werror -Iport tools/korean/profile_test.c -o .tmp/korean-profile-test
          .tmp/korean-profile-test
          /usr/bin/cc -std=gnu11 -O2 -DPC_PORT -DMULTI_REGION -DUSA -DENGLISH -I. -Iinclude -Iport -ffunction-sections -fdata-sections tools/korean/bottom_font_test.c -Wl,--gc-sections -lm -o .tmp/korean-bottom-font-test
          .tmp/korean-bottom-font-test

      - name: Build universal CIA and 3DSX
        env:
          TMC3DS_TOOLS_ROOT: ${{ github.workspace }}/.tmp/cia-tools
          TMC3DS_RUNTIME_PROBE: ${{ inputs.runtime_probe && 'ON' || 'OFF' }}
        run: ./platform/3ds/build.sh

      - name: Verify build outputs and legal files
        run: |
          VERSION="$(tr -d '\r\n' < platform/3ds/version.txt)"
          test ! -f baserom.gba
          ! git ls-files | grep -Ei '(^|/)([^/]*\.gba|[^/]*\.sav|[^/]*\.ppu1|tmc3ds\.log|bugreport_.*)(/|$)'
          ! git ls-files | grep -E '(^|/)(AGENTS\.md|PROTOCOL\.md|WORKFLOW\.md|GITHUB_RELEASE_WORKFLOW\.md)$'
          test -f "build-3ds/game/tmc-3ds-v${VERSION}.3dsx"
          test -f "build-3ds/game/tmc-3ds-v${VERSION}.cia"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.runtime_probe && 'tmc-3ds-runtime-probe' || 'tmc-3ds-packages' }}
          if-no-files-found: error
          path: |
            build-3ds/game/tmc-3ds-v*.3dsx
            build-3ds/game/tmc-3ds-v*.cia
